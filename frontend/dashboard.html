<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Stock Watch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">📈 Stock Watch</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="watchlist.html">Watchlist</a></li>
                    <li class="nav-item"><a class="nav-link" href="alerts.html">Alerts</a></li>

                    <!-- User Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown"
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="user-avatar me-2">
                                <span id="userInitial"></span>
                            </div>
                            <span id="username"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="#" id="settingsBtn">⚙️ Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">🚪 Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- Triggered Alerts -->
        <div id="triggeredAlertsContainer" class="d-none mb-4">
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                <h5 class="alert-heading">⚠️ Price Alerts Triggered!</h5>
                <div id="triggeredAlertsList"></div>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <!-- Welcome Section -->
        <div class="row mb-4">
            <div class="col-12">
                <h2>Welcome back, <span id="welcomeUsername"></span>!</h2>
                <p class="text-muted">Here's your stock portfolio overview</p>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="text-muted">Watchlist Stocks</h5>
                        <h2 class="mb-0" id="watchlistCount">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="text-muted">Active Alerts</h5>
                        <h2 class="mb-0" id="alertsCount">-</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stock Charts -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h4>Watchlist Price Trends</h4>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-sm btn-outline-primary active" onclick="loadDashboardChart('1h')">1 Hour</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="loadDashboardChart('24h')">24 Hours</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="loadDashboardChart('7d')">7 Days</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart Container (dynamically generate multiple charts) -->
        <div id="chartContainer" class="row">
            <!-- Each stock has an independent chart card -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state d-none">
            <div class="card shadow">
                <div class="card-body text-center py-5">
                    <p class="display-1">📊</p>
                    <p class="h5">Watchlist is empty</p>
                    <a href="watchlist.html" class="btn btn-primary mt-3">Add Stocks</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Setting Modal -->
    <div class="modal fade" id="alertModal" tabindex="-1" aria-labelledby="alertModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="alertModalLabel">Set Price Alert</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="alertModalForm">
                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="text" class="form-control" id="alertStockInfo" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Current Price</label>
                            <input type="text" class="form-control" id="alertCurrentPrice" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="alertCondition" class="form-label">Alert Condition</label>
                            <select class="form-select" id="alertCondition" required>
                                <option value="">Select condition...</option>
                                <option value="above">Price above</option>
                                <option value="below">Price below</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="alertTargetPrice" class="form-label">Target Price</label>
                            <input type="number" class="form-control" id="alertTargetPrice"
                                   placeholder="Enter target price" step="0.01" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitAlert()">Create Alert</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/config.js"></script>

    <script>
        // Check authentication
        if (!checkAuth()) {
            throw new Error('Not authenticated');
        }

        const user = Storage.getUser();
        document.getElementById('username').textContent = user.username;
        document.getElementById('welcomeUsername').textContent = user.username;

        // Set user initial (first letter of username)
        const initial = user.username.charAt(0).toUpperCase();
        document.getElementById('userInitial').textContent = initial;

        let dashboardCharts = {}; // Store multiple chart instances
        let watchlistStocks = [];
        let currentRange = '1h';

        // Load dashboard data
        async function loadDashboard() {
            try {
                const data = await apiRequest(`${CONFIG.API_ENDPOINTS.DASHBOARD}/${user.id}`);

                // Update counts
                document.getElementById('watchlistCount').textContent = data.top_stocks.length;
                document.getElementById('alertsCount').textContent = data.active_alerts_count;

                // Save watchlist stocks
                watchlistStocks = data.top_stocks;

                // Load chart with default range
                await loadDashboardChart('1h');

                // Check for triggered alerts
                checkTriggeredAlerts();

            } catch (error) {
                console.error('Failed to load dashboard:', error);
            }
        }

        // Load dashboard chart - one independent chart per stock
        async function loadDashboardChart(range = '1h') {
            currentRange = range;
            const chartContainer = document.getElementById('chartContainer');
            const emptyState = document.getElementById('emptyState');

            // If watchlist is empty
            if (watchlistStocks.length === 0) {
                chartContainer.innerHTML = '';
                emptyState.classList.remove('d-none');
                return;
            }

            emptyState.classList.add('d-none');

            // Update active button
            document.querySelectorAll('.btn-group .btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event?.target?.classList?.add('active');

            // Configure titles
            const rangeLabels = {
                '1h': 'Last 1 Hour',
                '24h': 'Last 24 Hours',
                '7d': 'Last 7 Days'
            };

            try {
                // Clear container
                chartContainer.innerHTML = '';
                dashboardCharts = {};

                // Create chart for each stock
                for (let i = 0; i < watchlistStocks.length; i++) {
                    const stock = watchlistStocks[i];
                    const symbol = stock.stock_symbol;
                    const stockName = stock.stock_name || symbol;

                    // Create chart card
                    const chartCard = document.createElement('div');
                    chartCard.className = 'col-md-6 mb-4';
                    chartCard.innerHTML = `
                        <div class="card shadow h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5 class="card-title mb-0">
                                        <span class="stock-symbol">${symbol}</span>
                                        <small class="text-muted"> - ${stockName}</small>
                                    </h5>
                                    <button class="btn btn-sm btn-warning" onclick="openAlertModal('${symbol}', '${stockName}', ${stock.current_price || 0})">
                                        Set Alert
                                    </button>
                                </div>
                                <div id="chart-${symbol}" style="width: 100%; height: 280px;"></div>
                            </div>
                        </div>
                    `;
                    chartContainer.appendChild(chartCard);

                    // Get historical data
                    try {
                        const history = await apiRequest(`${CONFIG.API_ENDPOINTS.STOCK_HISTORY}/${symbol}/history?range=${range}`);

                        if (history.length === 0) {
                            document.getElementById(`chart-${symbol}`).innerHTML =
                                '<div class="text-center text-muted py-5">No historical data</div>';
                            continue;
                        }

                        const times = history.map(item => item.time);
                        const prices = history.map(item => item.price);

                        // Initialize chart
                        const chartDom = document.getElementById(`chart-${symbol}`);
                        const chart = echarts.init(chartDom);
                        dashboardCharts[symbol] = chart;

                        // Configure chart options
                        const option = {
                            tooltip: {
                                trigger: 'axis',
                                formatter: function(params) {
                                    return `${params[0].name}<br/>Price: $${params[0].value.toFixed(2)}`;
                                }
                            },
                            grid: {
                                left: '3%',
                                right: '4%',
                                bottom: '3%',
                                top: '10%',
                                containLabel: true
                            },
                            xAxis: {
                                type: 'category',
                                boundaryGap: false,
                                data: times,
                                axisLabel: {
                                    rotate: 45,
                                    fontSize: 9
                                }
                            },
                            yAxis: {
                                type: 'value',
                                scale: true,
                                axisLabel: {
                                    formatter: '${value}',
                                    fontSize: 10
                                }
                            },
                            series: [{
                                type: 'line',
                                smooth: true,
                                symbol: 'circle',
                                symbolSize: 5,
                                data: prices,
                                lineStyle: {
                                    width: 2,
                                    color: '#4bc0c0'
                                },
                                itemStyle: {
                                    color: '#4bc0c0'
                                },
                                areaStyle: {
                                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                        { offset: 0, color: 'rgba(75, 192, 192, 0.3)' },
                                        { offset: 1, color: 'rgba(75, 192, 192, 0.05)' }
                                    ])
                                }
                            }]
                        };

                        chart.setOption(option);

                    } catch (error) {
                        console.error(`Failed to fetch ${symbol}:`, error);
                        document.getElementById(`chart-${symbol}`).innerHTML =
                            '<div class="text-center text-danger py-5">Failed to load</div>';
                    }
                }

                // Responsive resize
                window.addEventListener('resize', function() {
                    Object.values(dashboardCharts).forEach(chart => {
                        if (chart) {
                            chart.resize();
                        }
                    });
                });

            } catch (error) {
                console.error('Failed to load dashboard chart:', error);
                Modal.error('Failed to load chart: ' + error.message);
            }
        }

        // Check for triggered alerts
        async function checkTriggeredAlerts() {
            try {
                const triggered = await apiRequest(`${CONFIG.API_ENDPOINTS.CHECK_ALERTS}/${user.id}`);

                if (triggered.length > 0) {
                    const container = document.getElementById('triggeredAlertsContainer');
                    const list = document.getElementById('triggeredAlertsList');

                    list.innerHTML = triggered.map(alert => `
                        <div class="mb-2">
                            <strong>${alert.stock_symbol}</strong> (${alert.stock_name}):
                            Price is <strong>${alert.condition}</strong> $${alert.target_price}
                            (Current: $${alert.current_price.toFixed(2)})
                        </div>
                    `).join('');

                    container.classList.remove('d-none');
                }
            } catch (error) {
                console.error('Failed to check alerts:', error);
            }
        }

        // View stock detail
        function viewDetail(symbol) {
            Navigation.toStockDetail(symbol);
        }

        // Alert modal management
        let currentAlertStock = null;

        function openAlertModal(symbol, stockName, currentPrice) {
            currentAlertStock = { symbol, stockName, currentPrice };

            // Fill form
            document.getElementById('alertStockInfo').value = `${symbol} - ${stockName}`;
            document.getElementById('alertCurrentPrice').value = `$${currentPrice.toFixed(2)}`;
            document.getElementById('alertCondition').value = '';
            document.getElementById('alertTargetPrice').value = '';

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('alertModal'));
            modal.show();
        }

        async function submitAlert() {
            const condition = document.getElementById('alertCondition').value;
            const targetPrice = parseFloat(document.getElementById('alertTargetPrice').value);

            if (!condition || !targetPrice) {
                Modal.error('Please fill in all required fields');
                return;
            }

            if (!currentAlertStock) {
                Modal.error('Stock information lost, please reopen settings');
                return;
            }

            try {
                await apiRequest(CONFIG.API_ENDPOINTS.ALERTS, {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: user.id,
                        stock_symbol: currentAlertStock.symbol,
                        condition: condition,
                        target_price: targetPrice
                    })
                });

                // Close modal
                const modal = bootstrap.Modal.getInstance(document.getElementById('alertModal'));
                modal.hide();

                // Show success message
                await Modal.success(`Price alert created for ${currentAlertStock.symbol}`);

                // Clear form
                document.getElementById('alertModalForm').reset();
                currentAlertStock = null;

            } catch (error) {
                Modal.error('Failed to create alert: ' + error.message);
            }
        }

        // Settings button
        document.getElementById('settingsBtn').addEventListener('click', (e) => {
            e.preventDefault();
            Navigation.toSettings();
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const confirmed = await Modal.confirm(
                'Are you sure you want to logout?',
                'Confirm Logout',
                { confirmText: 'Logout', confirmClass: 'btn-danger', icon: '🚪' }
            );
            if (confirmed) {
                Storage.clearUser();
                Navigation.toLogin();
            }
        });

        // Load data on page load
        loadDashboard();
    </script>
</body>
</html>
