<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Details - Stock Watch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">📈 Stock Watch</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="watchlist.html">Watchlist</a></li>
                    <li class="nav-item"><a class="nav-link" href="alerts.html">Alerts</a></li>

                    <!-- User Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown"
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="user-avatar me-2">
                                <span id="userInitial"></span>
                            </div>
                            <span id="username"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="#" id="settingsBtn">⚙️ Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">🚪 Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- Back Button -->
        <div class="mb-3">
            <button onclick="history.back()" class="btn btn-secondary">← Back</button>
        </div>

        <!-- Stock Info Card -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <h2 id="stockName">Loading...</h2>
                                <p class="text-muted mb-3" id="stockSymbol">-</p>
                            </div>
                            <div class="col-md-4 text-md-end">
                                <h1 class="price mb-0" id="currentPrice">-</h1>
                                <p class="mb-0" id="priceChange">-</p>
                            </div>
                        </div>

                        <hr>

                        <div class="row">
                            <div class="col-6 col-md-3 mb-3">
                                <small class="text-muted">Open</small>
                                <p class="mb-0 fw-bold" id="openPrice">-</p>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <small class="text-muted">Previous Close</small>
                                <p class="mb-0 fw-bold" id="prevClose">-</p>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <small class="text-muted">High</small>
                                <p class="mb-0 fw-bold" id="highPrice">-</p>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <small class="text-muted">Low</small>
                                <p class="mb-0 fw-bold" id="lowPrice">-</p>
                            </div>
                        </div>

                        <div class="text-muted small">
                            Last updated: <span id="lastUpdated">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart Card -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="card-title mb-0">价格历史</h4>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-sm btn-outline-primary active" onclick="loadChart('1h')">1小时</button>
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="loadChart('24h')">24小时</button>
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="loadChart('7d')">7天</button>
                            </div>
                        </div>

                        <div class="chart-container">
                            <div id="priceChart" style="width: 100%; height: 400px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Set Alert Button -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-body">
                        <h5>Set Price Alert</h5>
                        <form id="alertForm" class="row g-3">
                            <div class="col-md-4">
                                <select class="form-select" id="alertCondition" required>
                                    <option value="">Select condition...</option>
                                    <option value="above">Price above</option>
                                    <option value="below">Price below</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <input type="number" class="form-control" id="targetPrice"
                                       placeholder="Target price" step="0.01" required>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-primary w-100">Create Alert</button>
                            </div>
                        </form>
                        <div id="alertMessage" class="alert mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/config.js"></script>

    <script>
        // Check authentication
        if (!checkAuth()) {
            throw new Error('Not authenticated');
        }

        const user = Storage.getUser();

        // Set user initial
        const initial = user.username.charAt(0).toUpperCase();
        document.getElementById('userInitial').textContent = initial;
        document.getElementById('username').textContent = user.username;

        const urlParams = new URLSearchParams(window.location.search);
        const symbol = urlParams.get('symbol');

        if (!symbol) {
            Modal.error('No stock symbol provided').then(() => {
                Navigation.toWatchlist();
            });
        }

        let priceChart = null;

        // Load stock details
        async function loadStockDetails() {
            try {
                const stock = await apiRequest(`${CONFIG.API_ENDPOINTS.STOCK_DETAIL}/${symbol}`);

                document.getElementById('stockName').textContent = stock.stock_name || symbol;
                document.getElementById('stockSymbol').textContent = symbol;
                document.getElementById('currentPrice').textContent = `$${stock.current_price.toFixed(2)}`;

                const changeClass = stock.change_amount >= 0 ? 'text-success' : 'text-danger';
                const changeSign = stock.change_amount >= 0 ? '+' : '';
                document.getElementById('priceChange').className = changeClass;
                document.getElementById('priceChange').textContent =
                    `${changeSign}$${stock.change_amount.toFixed(2)} (${changeSign}${stock.change_percent.toFixed(2)}%)`;

                document.getElementById('openPrice').textContent = `$${stock.open_price.toFixed(2)}`;
                document.getElementById('prevClose').textContent = `$${stock.previous_close.toFixed(2)}`;
                document.getElementById('highPrice').textContent = `$${stock.high_price.toFixed(2)}`;
                document.getElementById('lowPrice').textContent = `$${stock.low_price.toFixed(2)}`;
                document.getElementById('lastUpdated').textContent = new Date(stock.updated_at).toLocaleString();

            } catch (error) {
                Modal.error('Failed to load stock details: ' + error.message).then(() => {
                    Navigation.toWatchlist();
                });
            }
        }

        // Load chart with ECharts
        async function loadChart(range = '1h') {
            try {
                const history = await apiRequest(`${CONFIG.API_ENDPOINTS.STOCK_HISTORY}/${symbol}/history?range=${range}`);

                if (history.length === 0) {
                    Modal.warning('暂无历史数据');
                    return;
                }

                const times = history.map(item => item.time);
                const prices = history.map(item => item.price);

                // Initialize or get chart instance
                const chartDom = document.getElementById('priceChart');
                if (!priceChart) {
                    priceChart = echarts.init(chartDom);
                }

                // Update active button
                document.querySelectorAll('.btn-group .btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event?.target?.classList?.add('active');

                // Configure title based on range
                const rangeLabels = {
                    '1h': '最近 1 小时',
                    '24h': '最近 24 小时',
                    '7d': '最近 7 天'
                };

                // Configure chart options
                const option = {
                    title: {
                        text: `${symbol} - ${rangeLabels[range] || range}`,
                        left: 'center',
                        textStyle: {
                            fontSize: 16,
                            fontWeight: 'normal'
                        }
                    },
                    tooltip: {
                        trigger: 'axis',
                        formatter: function(params) {
                            return `${params[0].name}<br/>价格: $${params[0].value.toFixed(2)}`;
                        }
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '3%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: times,
                        axisLabel: {
                            rotate: 45,
                            fontSize: 10
                        }
                    },
                    yAxis: {
                        type: 'value',
                        scale: true,
                        axisLabel: {
                            formatter: '${value}'
                        }
                    },
                    series: [
                        {
                            name: '收盘价',
                            type: 'line',
                            smooth: true,
                            symbol: 'circle',
                            symbolSize: 6,
                            data: prices,
                            lineStyle: {
                                width: 2,
                                color: '#4bc0c0'
                            },
                            itemStyle: {
                                color: '#4bc0c0'
                            },
                            areaStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: 'rgba(75, 192, 192, 0.3)' },
                                    { offset: 1, color: 'rgba(75, 192, 192, 0.05)' }
                                ])
                            }
                        }
                    ]
                };

                // Set option
                priceChart.setOption(option);

                // Responsive resize
                window.addEventListener('resize', function() {
                    priceChart.resize();
                });

            } catch (error) {
                console.error('Failed to load chart:', error);
            }
        }

        // Create alert
        document.getElementById('alertForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const condition = document.getElementById('alertCondition').value;
            const targetPrice = parseFloat(document.getElementById('targetPrice').value);

            try {
                await apiRequest(CONFIG.API_ENDPOINTS.ALERTS, {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: user.id,
                        stock_symbol: symbol,
                        condition: condition,
                        target_price: targetPrice
                    })
                });

                Modal.success('Alert created successfully!');
                document.getElementById('alertForm').reset();

            } catch (error) {
                showAlertMessage(error.message, 'danger');
            }
        });

        function showAlertMessage(message, type) {
            const alert = document.getElementById('alertMessage');
            alert.className = `alert alert-${type} mt-3`;
            alert.textContent = message;
            alert.classList.remove('d-none');

            setTimeout(() => {
                alert.classList.add('d-none');
            }, 3000);
        }

        // Settings button
        document.getElementById('settingsBtn').addEventListener('click', (e) => {
            e.preventDefault();
            Navigation.toSettings();
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const confirmed = await Modal.confirm(
                'Are you sure you want to logout?',
                'Confirm Logout',
                { confirmText: 'Logout', confirmClass: 'btn-danger', icon: '🚪' }
            );
            if (confirmed) {
                Storage.clearUser();
                Navigation.toLogin();
            }
        });

        // Load data on page load
        loadStockDetails();
        loadChart('1h');
    </script>
</body>
</html>
