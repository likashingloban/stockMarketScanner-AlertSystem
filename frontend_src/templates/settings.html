<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Stock Watch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">📈 Stock Watch</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="watchlist.html">Watchlist</a></li>
                    <li class="nav-item"><a class="nav-link" href="alerts.html">Alerts</a></li>

                    <!-- User Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown"
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="user-avatar me-2">
                                <span id="userInitial"></span>
                            </div>
                            <span id="username"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item active" href="settings.html">⚙️ Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">🚪 Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title mb-4">⚙️ Account Settings</h2>

                        <!-- User Info -->
                        <div class="mb-4 pb-3 border-bottom">
                            <h5 class="text-muted">Account Information</h5>
                            <div class="d-flex align-items-center mt-3">
                                <div class="user-avatar me-3" style="width: 60px; height: 60px; font-size: 24px;">
                                    <span id="avatarInitial"></span>
                                </div>
                                <div>
                                    <h5 class="mb-1" id="displayUsername"></h5>
                                    <p class="text-muted mb-0" id="displayEmail"></p>
                                </div>
                            </div>
                        </div>

                        <!-- Change Password Form -->
                        <h5 class="text-muted mb-3">Change Password</h5>
                        <form id="changePasswordForm">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Current Password</label>
                                <input type="password" class="form-control" id="currentPassword" required>
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New Password</label>
                                <input type="password" class="form-control" id="newPassword" required minlength="6">
                                <small class="text-muted">Minimum 6 characters</small>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Update Password</button>
                            </div>
                        </form>

                        <div class="mt-3">
                            <a href="dashboard.html" class="btn btn-secondary w-100">Back to Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/config.js"></script>

    <script>
        // Check authentication
        if (!checkAuth()) {
            throw new Error('Not authenticated');
        }

        const user = Storage.getUser();

        // Set user info
        const initial = user.username.charAt(0).toUpperCase();
        document.getElementById('userInitial').textContent = initial;
        document.getElementById('avatarInitial').textContent = initial;
        document.getElementById('username').textContent = user.username;
        document.getElementById('displayUsername').textContent = user.username;
        document.getElementById('displayEmail').textContent = user.email;

        // Handle form submission
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                Modal.error('New passwords do not match', 'Validation Error');
                return;
            }

            // Validate new password is different from current
            if (currentPassword === newPassword) {
                Modal.warning('New password must be different from current password', 'Validation Error');
                return;
            }

            try {
                await apiRequest(CONFIG.API_ENDPOINTS.CHANGE_PASSWORD, {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: user.id,
                        old_password: currentPassword,
                        new_password: newPassword
                    })
                });

                await Modal.success('Password changed successfully! Please login again.', 'Success');

                // Clear form
                document.getElementById('changePasswordForm').reset();

                // Logout and redirect to login
                Storage.clearUser();
                Navigation.toLogin();

            } catch (error) {
                Modal.error(error.message, 'Error');
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const confirmed = await Modal.confirm(
                'Are you sure you want to logout?',
                'Confirm Logout',
                { confirmText: 'Logout', confirmClass: 'btn-danger', icon: '🚪' }
            );
            if (confirmed) {
                Storage.clearUser();
                Navigation.toLogin();
            }
        });
    </script>
</body>
</html>
