{% extends "base.html" %}

{% block title %}登入 - Stock Watch{% endblock %}

{% block body_class %}bg-light{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
            <!-- 登入卡片 -->
            <div class="card shadow">
                <div class="card-body p-5">
                    <!-- Logo and Title -->
                    <div class="text-center mb-4">
                        <h1 class="h3 mb-3 fw-bold text-primary">📈 Stock Watch</h1>
                        <p class="text-muted">Stock Monitoring & Alert System</p>
                    </div>

                    <!-- Login Form -->
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">Login</button>
                        </div>

                        <div class="text-center">
                            <small class="text-muted">
                                Don't have an account?
                                <a href="{{ url_for('register') }}" class="text-decoration-none">Register now</a>
                            </small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
