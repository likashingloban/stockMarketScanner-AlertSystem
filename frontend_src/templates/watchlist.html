<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观察清单 - Stock Watch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Fix dropdown z-index issue */
        .navbar .dropdown-menu {
            z-index: 1050;
        }

        /* Ensure sticky table headers don't overlap dropdowns */
        .table thead.sticky-top {
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">Stock Watch</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="watchlist.html">Watchlist</a></li>
                    <li class="nav-item"><a class="nav-link" href="alerts.html">Alerts</a></li>

                    <!-- User Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown"
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="user-avatar me-2">
                                <span id="userInitial"></span>
                            </div>
                            <span id="username"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="#" id="settingsBtn">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <div class="row">
            <!-- 左侧：所有可用股票 -->
            <div class="col-md-6">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h4 class="card-title mb-3">All Stocks</h4>
                        <div class="mb-3">
                            <input type="text" class="form-control" id="searchAllStocks"
                                   placeholder="Search by symbol or name...">
                        </div>
                        <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                            <table class="table table-hover table-sm">
                                <thead class="table-light sticky-top">
                                    <tr>
                                        <th>Symbol</th>
                                        <th>Name</th>
                                        <th>Price</th>
                                        <th>Change</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="allStocksTable">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：我的观察清单 -->
            <div class="col-md-6">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h4 class="card-title mb-3">My Watchlist</h4>
                        <div id="myWatchlistContainer">
                            <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                                <table class="table table-hover table-sm">
                                    <thead class="table-light sticky-top">
                                        <tr>
                                            <th>Symbol</th>
                                            <th>Name</th>
                                            <th>Price</th>
                                            <th>Change</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="myWatchlistTable">
                                        <tr>
                                            <td colspan="5" class="text-center text-muted">Loading...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Empty State -->
                            <div id="emptyWatchlist" class="text-center py-5 d-none">
                                <svg width="64" height="64" fill="currentColor" class="text-muted mb-3" viewBox="0 0 16 16">
                                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                    <path d="M5 6.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-.646 2.854a.5.5 0 0 1 .708 0l1.5 1.5a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708-.708L5.207 12H3a.5.5 0 0 1 0-1h2.207l-.853-.854a.5.5 0 0 1 0-.708z"/>
                                </svg>
                                <p class="text-muted">Watchlist is empty</p>
                                <p class="text-muted small">Add stocks from the left panel</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/config.js"></script>

    <script>
        // Check authentication
        if (!checkAuth()) {
            throw new Error('Not authenticated');
        }

        const user = Storage.getUser();

        // Set user initial
        const initial = user.username.charAt(0).toUpperCase();
        document.getElementById('userInitial').textContent = initial;
        document.getElementById('username').textContent = user.username;

        let allStocks = [];
        let myWatchlist = [];

        // Load all stocks and watchlist
        async function loadData() {
            try {
                // 并行加载所有股票和我的观察清单
                const [allStocksData, watchlistData] = await Promise.all([
                    apiRequest(CONFIG.API_ENDPOINTS.ALL_STOCKS),
                    apiRequest(`${CONFIG.API_ENDPOINTS.WATCHLIST}/${user.id}`)
                ]);

                allStocks = allStocksData;
                myWatchlist = watchlistData;

                renderAllStocks();
                renderMyWatchlist();

            } catch (error) {
                console.error('Failed to load data:', error);
                if (typeof Modal !== 'undefined') {
                    Modal.error('Failed to load data: ' + error.message);
                }
            }
        }

        // Render all stocks table
        function renderAllStocks(filterText = '') {
            const tbody = document.getElementById('allStocksTable');

            // 过滤股票
            const filteredStocks = allStocks.filter(stock => {
                if (!filterText) return true;
                const searchLower = filterText.toLowerCase();
                return stock.stock_symbol.toLowerCase().includes(searchLower) ||
                       (stock.stock_name && stock.stock_name.toLowerCase().includes(searchLower));
            });

            if (filteredStocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No results found</td></tr>';
                return;
            }

            tbody.innerHTML = filteredStocks.map(stock => {
                // 检查是否已在观察清单中
                const inWatchlist = myWatchlist.some(w => w.stock_symbol === stock.stock_symbol);

                const changeClass = stock.change_percent >= 0 ? 'text-success' : 'text-danger';
                const changeSign = stock.change_percent >= 0 ? '+' : '';

                return `
                    <tr>
                        <td><strong class="stock-symbol">${stock.stock_symbol}</strong></td>
                        <td><small>${stock.stock_name || '-'}</small></td>
                        <td class="price">$${stock.current_price ? stock.current_price.toFixed(2) : '-'}</td>
                        <td class="${changeClass}">
                            <small>${stock.change_percent ? changeSign + stock.change_percent.toFixed(2) + '%' : '-'}</small>
                        </td>
                        <td>
                            ${inWatchlist ?
                                '<button class="btn btn-sm btn-secondary" disabled>Added</button>' :
                                `<button class="btn btn-sm btn-success" onclick="addToWatchlist('${stock.stock_symbol}')">+ Add</button>`
                            }
                            <button class="btn btn-sm btn-outline-primary" onclick="viewDetail('${stock.stock_symbol}')">Detail</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Render my watchlist table
        function renderMyWatchlist() {
            const tbody = document.getElementById('myWatchlistTable');
            const emptyState = document.getElementById('emptyWatchlist');
            const tableContainer = tbody.closest('.table-responsive');

            if (myWatchlist.length === 0) {
                tableContainer.classList.add('d-none');
                emptyState.classList.remove('d-none');
                return;
            }

            tableContainer.classList.remove('d-none');
            emptyState.classList.add('d-none');

            tbody.innerHTML = myWatchlist.map(stock => {
                const changeClass = stock.change_percent >= 0 ? 'text-success' : 'text-danger';
                const changeSign = stock.change_percent >= 0 ? '+' : '';

                return `
                    <tr>
                        <td><strong class="stock-symbol">${stock.stock_symbol}</strong></td>
                        <td><small>${stock.stock_name || '-'}</small></td>
                        <td class="price">$${stock.current_price ? stock.current_price.toFixed(2) : '-'}</td>
                        <td class="${changeClass}">
                            <small>${stock.change_percent ? changeSign + stock.change_percent.toFixed(2) + '%' : '-'}</small>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="removeFromWatchlist(${stock.id})">× Remove</button>
                            <button class="btn btn-sm btn-outline-primary" onclick="viewDetail('${stock.stock_symbol}')">Detail</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Add to watchlist
        async function addToWatchlist(symbol) {
            try {
                await apiRequest(CONFIG.API_ENDPOINTS.WATCHLIST, {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: user.id,
                        stock_symbol: symbol
                    })
                });

                Modal.success(`Added ${symbol} to watchlist`);

                // Reload data
                await loadData();

            } catch (error) {
                Modal.error('Failed to add: ' + error.message);
            }
        }

        // Remove from watchlist
        async function removeFromWatchlist(watchlistId) {
            const confirmed = await Modal.confirm(
                'Are you sure you want to remove this stock from watchlist?',
                'Confirm Removal',
                { confirmText: 'Remove', confirmClass: 'btn-danger', icon: '✖' }
            );

            if (!confirmed) return;

            try {
                await apiRequest(`${CONFIG.API_ENDPOINTS.WATCHLIST}/${watchlistId}`, {
                    method: 'DELETE'
                });

                Modal.success('Removed from watchlist');

                // Reload data
                await loadData();

            } catch (error) {
                Modal.error('Failed to remove: ' + error.message);
            }
        }

        // View stock detail
        function viewDetail(symbol) {
            Navigation.toStockDetail(symbol);
        }

        // Search functionality
        document.getElementById('searchAllStocks').addEventListener('input', (e) => {
            renderAllStocks(e.target.value);
        });

        // Settings button
        document.getElementById('settingsBtn').addEventListener('click', (e) => {
            e.preventDefault();
            Navigation.toSettings();
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const confirmed = await Modal.confirm(
                'Are you sure you want to logout?',
                'Confirm Logout',
                { confirmText: 'Logout', confirmClass: 'btn-danger', icon: '🚪' }
            );
            if (confirmed) {
                Storage.clearUser();
                Navigation.toLogin();
            }
        });

        // Load data on page load
        loadData();

        // Auto refresh every 10 seconds
        setInterval(loadData, 10000);
    </script>
</body>
</html>
