<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - Stock Watch</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 自定義樣式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <!-- 登入卡片 -->
                <div class="card shadow">
                    <div class="card-body p-5">
                        <!-- Logo and Title -->
                        <div class="text-center mb-4">
                            <h1 class="h3 mb-3 fw-bold text-primary">📈 Stock Watch</h1>
                            <p class="text-muted">Stock Monitoring & Alert System</p>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">Login</button>
                            </div>

                            <div class="text-center">
                                <small class="text-muted">
                                    Don't have an account?
                                    <a href="register.html" class="text-decoration-none">Register now</a>
                                </small>
                            </div>
                        </form>

                        <!-- Error Message -->
                        <div id="errorAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Modal Helper -->
    <script src="js/modal.js"></script>

    <!-- Config -->
    <script src="js/config.js"></script>

    <!-- 登入邏輯 -->
    <script>
        // 如果已登入,直接跳轉到 Dashboard
        if (Storage.isLoggedIn()) {
            Navigation.toDashboard();
        }

        // 處理登入表單提交
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // 調用登入 API
                const response = await apiRequest(CONFIG.API_ENDPOINTS.LOGIN, {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                // Save user data to localStorage
                Storage.saveUser({
                    id: response.user.id,
                    username: response.user.username,
                    email: response.user.email,
                    token: response.token
                });

                // Redirect to Dashboard
                Modal.success('Login successful!', 'Success');
                setTimeout(() => {
                    Navigation.toDashboard();
                }, 500);

            } catch (error) {
                // Display error message
                const errorAlert = document.getElementById('errorAlert');
                errorAlert.textContent = error.message;
                errorAlert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
